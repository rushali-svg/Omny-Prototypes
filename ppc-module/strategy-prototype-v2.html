<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Management — Strategy (Omny · merged v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<style>
  :root{
    --ink:#3d3d3d;--ink-2:#595959;--ink-3:#757575;--muted:#4d4d4d;
    --line:#e3e3e3;--line-2:#eeeeee;--panel:#fafafa;
    --blue:#2f90de;--purple:#b885ff;--green:#22863d;--red:#db333b;
    --sel:#2f6bf3;--sel-bg:#eef3fe;--sel-bd:#8ab4ff;
    --panel-blue:#f7f9fd;--pnl-bd:#8ab4ff;
    --lav:#f6f2ff;--orange:#e0872a;--orange-bg:#fdf3e6;--orange-tx:#c9781c;
    --create:#5a4fcf;--strat-purple:#8a7bef;--gold:#ccb771;--rail:#1a1817;
    --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--sel);text-decoration:none}a:hover{color:#2258d0}
  .app{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:0;gap:0;position:sticky;top:0;height:100vh}
  .rail .acct{height:64px;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,246,240,.08);border-bottom:1px solid rgba(0,0,0,.14)}
  .rail .acct .box{background:rgba(0,0,0,.14);width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .avatar{width:32px;height:32px;border-radius:6px;background:var(--gold);color:#2a230c;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .rail .nav{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;width:100%}
  .rail .ni{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#c1bdbd;font-size:18px;cursor:pointer}
  .rail .ni:hover{background:rgba(255,255,255,.06);color:#fff}
  .rail .ni.on{background:rgba(255,255,255,.1);color:#fff}
  .rail .grow{flex:1}
  .rail .bell{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#c1bdbd;font-size:19px;cursor:pointer}
  .rail .bell .b{position:absolute;top:-2px;left:20px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:16px;padding:2px 5px;line-height:1}
  .rail .logo{height:52px;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,246,240,.08)}
  .rail .logo .dot{width:24px;height:24px;border-radius:50%;background:#e5f6ff;display:flex;align-items:center;justify-content:center;color:#2f90de;font-size:14px}

  .main{min-width:0;display:flex;flex-direction:column}
  .pagenav{height:60px;display:flex;align-items:center;justify-content:flex-start;gap:24px;padding:0 24px;background:#fff}
  .pagenav .title{font-size:16px;font-weight:500;color:var(--ink-3)}
  .selwrap{display:flex;gap:16px;align-items:center}
  .selector{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--muted);font-weight:500;cursor:default;height:36px}
  .selector .flag{width:16px;height:12px;border-radius:2px;object-fit:cover;display:block}
  .selector i{color:var(--ink-3);font-size:16px}
  .tabsbar{height:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:8px;background:#fff}
  .tab{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .tab i{font-size:17px}
  .tab:hover{background:#f4f5f7}
  .tab.on{color:var(--ink);font-weight:500}
  .tabsbar .spacer{flex:1}

  .section{background:var(--panel);padding:48px 24px;position:relative}
  .panel{border:0;border-radius:0;background:transparent;padding:0;display:flex;flex-direction:column;gap:28px;position:relative}
  .pause{position:absolute;top:-18px;left:0;right:0;display:flex;justify-content:center;z-index:3}
  .pause button{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:500;color:var(--orange);background:#fff;border:1px solid #f0c98a;border-radius:10px;padding:8px 16px;cursor:pointer;box-shadow:0 1px 3px rgba(16,24,40,.06)}

  .setrow{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border:1px solid #e8ebf3;border-radius:8px;overflow:hidden}
  .setcard{padding:16px 20px;border-right:1px solid #e8ebf3;cursor:pointer;transition:background .12s}
  .setcard:last-child{border-right:0}
  .setcard:hover:not(.on){background:#fafbfc}
  .setcard.on{background:var(--sel-bg);box-shadow:inset 0 0 0 1.5px var(--sel)}
  .setcard .r1{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--ink)}
  .setcard .r1 i{font-size:19px;color:var(--ink-2)}
  .setcard.on .r1,.setcard.on .r1 i{color:var(--sel)}
  .setcard p{margin:8px 0 0 29px;font-size:13px;color:var(--ink-3);line-height:1.4}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card-h{height:68px;display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}
  .card-h .ct{font-size:16px;font-weight:600;color:var(--ink)}
  .card-h .cw{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--ink-3);font-weight:500;cursor:pointer}
  .card-h .cw i{font-size:13px}
  .card-h .grow{flex:1}
  .btn-create{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;font-weight:600;color:var(--create);background:#fff;border:1px solid #d5d1f2;border-radius:10px;padding:9px 16px;cursor:pointer}
  .btn-create:hover{background:#f7f6ff}
  .btn-create i{font-size:18px}

  .scrollx{overflow-x:auto}
  .tl{min-width:1040px;display:grid;grid-template-columns:190px 1fr;background:var(--panel)}
  .tl .lcol{border-right:1px solid var(--line);box-shadow:2px 0 12px rgba(0,0,0,.05);background:#fff;position:relative;z-index:2}
  .tl .lcell{height:49px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:flex-end;text-align:right;padding:0 12px;font-size:13px;color:var(--ink-3);line-height:1.2}
  .tl .lhead{height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tl .rcol{position:relative;min-width:0}
  .wkhead{display:grid;grid-template-columns:repeat(10,1fr);height:26px;border-bottom:1px solid var(--line)}
  .wkhead div{font-size:13px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;padding:0 8px;border-right:1px solid var(--line-2)}
  .wkhead div:last-child{border-right:0}
  .wkhead .now{background:var(--lav);position:relative}
  .wkhead .now::after{content:"";position:absolute;right:8px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--red)}
  .trow{height:49px;border-bottom:1px solid var(--line-2);position:relative}
  .colgrid{display:grid;grid-template-columns:repeat(10,1fr);height:100%}
  .colgrid>div{border-right:1px solid var(--line-2)}
  .colgrid>div:last-child{border-right:0}
  .colgrid .now{background:var(--lav)}
  .strat{position:relative}
  .stratgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);align-items:center}
  .sbox{margin:0 3px;height:37px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px var(--line),2px 2px 3px rgba(0,0,0,.02);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden}
  .spill{display:inline-flex;align-items:center;gap:4px;background:#736bc9;color:#fff;border-radius:4px;padding:4px 8px;font-size:12px;font-weight:600;flex:0 0 auto}
  .spill i{font-size:12px}
  .sdiv{width:1px;height:18px;background:var(--line);flex:0 0 auto}
  .chartcell{position:absolute;inset:0}
  .satcell{display:flex;align-items:center;justify-content:center}
  .satcell.band{background:rgba(0,0,0,.03)}
  .gdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .pgcell{display:flex;align-items:center;justify-content:center;position:relative;font-size:14px;font-weight:500;color:var(--ink-2)}
  .pgcell .d{position:absolute;left:14px;font-size:13px;font-weight:500}

  .alloc-h{display:flex;align-items:center;gap:10px;padding-top:24px}
  .alloc-h i{font-size:20px;color:var(--ink-2)}
  .alloc-h h2{font-size:16px;font-weight:600;margin:0;color:var(--ink)}
  .alloc-sub{font-size:13px;color:var(--ink-3);margin:6px 0 0 30px}

  .ptable{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .toolbar{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .status i{font-size:15px;color:var(--ink-3);margin-left:2px}
  .toolbar .grow{flex:1}
  .avgbud{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
  .avgbud b{color:var(--ink);font-weight:600;font-size:14px}
  .avgbud .circ{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--green)}
  .totalloc{display:inline-flex;align-items:center;gap:8px;background:var(--orange-bg);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--orange-tx)}
  .totalloc b{font-size:15px;font-weight:700}
  .expand{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink-2);cursor:pointer}
  .expand i{font-size:15px}

  .tscroll{overflow-x:auto}
  .pgrid{min-width:1560px;display:grid;grid-template-columns:44px 54px 34px minmax(240px,1fr) 96px 100px 92px 84px 112px 116px 116px 120px 116px 108px 120px}
  .pgrid>div{border-bottom:1px solid var(--line-2);display:flex;align-items:center;padding:8px 10px;font-size:13px;min-height:44px}
  .lavc{background:var(--lav)}
  .totalrow>div{background:var(--lav);border-bottom:1px solid var(--line);min-height:44px;font-size:13px}
  .totalrow .lab{grid-column:1 / 9;justify-content:flex-end;color:var(--ink-3);gap:6px;background:#fff}
  .totalrow .amt{font-weight:600;color:var(--ink)}
  .grouprow>div{border-bottom:1px solid var(--line);min-height:52px;padding:8px 12px}
  .searchcell{grid-column:4 / 4}
  .searchbox{position:relative;width:100%;max-width:280px}
  .searchbox i{position:absolute;left:11px;top:9px;color:var(--ink-3);font-size:15px}
  .searchbox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 33px;font:inherit;font-size:13px;color:var(--ink)}
  .prio{grid-column:5 / 7;justify-content:center}
  .priopill{background:#eef0f3;color:var(--ink-2);border-radius:8px;font-size:12px;padding:5px 11px;display:inline-flex;align-items:center;gap:5px}
  .roascell{grid-column:8 / 10;justify-content:flex-end;gap:8px}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:500}
  .sw{width:38px;height:21px;border-radius:11px;background:var(--blue);position:relative}
  .sw::after{content:"";position:absolute;top:2.5px;right:2.5px;width:16px;height:16px;border-radius:50%;background:#fff}
  .grp-perf{grid-column:10 / 13;justify-content:flex-start;font-weight:600;color:var(--ink)}
  .grp-disc{grid-column:13 / 16;justify-content:flex-start;font-weight:600;color:var(--ink)}
  .headrow>div{border-bottom:1px solid var(--line);min-height:52px;color:var(--ink-3);font-size:13px;font-weight:500;align-items:flex-end;line-height:1.25;padding-bottom:9px}
  .headrow .num{justify-content:flex-end;text-align:right}
  .num{justify-content:flex-end;text-align:right}
  .col2{flex-direction:column;align-items:flex-end;justify-content:center;gap:3px}
  .pthumb{width:36px;height:36px;border-radius:4px;object-fit:cover;box-shadow:inset 0 0 0 1px #dde1e6;flex:0 0 auto;overflow:hidden}
  .pname{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pname .nm{font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pname .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#93999f}
  .pname .meta .flag{width:14px;height:11px;border-radius:2px;object-fit:cover}
  .pname .meta i{font-size:12px}
  .statechip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:3px 8px;border-radius:7px;width:max-content;margin-top:2px}
  .statechip i{font-size:12px}
  .state-paused{background:#f4f2f2;color:#9b9797}
  .state-new{background:#eaf6ee;color:var(--green)}
  .state-inactive{background:#f2f3f5;color:#8b9099}
  .amt{font-weight:600;color:var(--ink)}
  .sub{color:var(--ink-3);font-size:12px}
  .mult-b{color:var(--blue);font-weight:600}.mult-o{color:var(--orange);font-weight:600}
  .pct-g{color:var(--green);font-weight:600}.pct-r{color:var(--red);font-weight:600}
  .circ{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--green);flex:0 0 auto}
  .circ.r{border-color:var(--red)}
  .spk{color:var(--purple);flex:0 0 auto}
  .gtoggle{width:38px;height:21px;border-radius:11px;background:var(--green);position:relative;flex:0 0 auto;cursor:pointer}
  .gtoggle::after{content:"";position:absolute;top:2.5px;left:19px;width:16px;height:16px;border-radius:50%;background:#fff;display:flex}
  .gtoggle .pl{position:absolute;top:6px;left:6px;color:#fff;font-size:9px}
  .ban{color:#b9bec4;font-size:17px}

  /* brand table */
  .bgrid{min-width:1180px;display:grid;grid-template-columns:54px 34px minmax(240px,1fr) 160px 110px 120px 116px 132px 132px 122px 124px}
  .bgrid>div{border-bottom:1px solid var(--line-2);display:flex;align-items:center;padding:8px 10px;font-size:13px;min-height:52px}
  .grp-b{justify-content:flex-start;font-weight:600;color:var(--ink)}
  .ctype{font-size:11px;font-weight:600;letter-spacing:.3px;color:#93999f}
  .btoggle{width:40px;height:22px;border-radius:11px;position:relative;flex:0 0 auto}
  .btoggle.ai{background:#736bc9}
  .btoggle.ai::after{content:"";position:absolute;top:2.5px;right:2.5px;width:17px;height:17px;border-radius:50%;background:#fff}
  .btoggle.ai .sp{position:absolute;top:6px;right:5px;color:#736bc9;font-size:10px;z-index:1}
  .btoggle.off{background:#cfe0f5}
  .btoggle.off::after{content:"";position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:#fff}
  .btoggle.dis{background:#e3e6ea;opacity:.7}
  .gtoggle.off{background:#d3d6db}
  .gtoggle.off::after{left:2.5px}
  .gtoggle.off .pl{left:auto;right:6px;color:#8b9099}
  .cellfocus{box-shadow:inset 0 0 0 2px var(--sel)}

  /* global bid view */
  .gview{display:flex;flex-direction:column;align-items:center}
  .gpanels{display:grid;grid-template-columns:minmax(380px,0.92fr) 1.08fr;gap:22px;width:100%;align-items:start}
  .gpanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px 20px 20px;position:relative}
  .gtab{position:absolute;top:-15px;left:22px;background:#3d3b3a;color:#fff;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;display:inline-flex;align-items:center;gap:7px}
  .gtab.purple{background:#736bc9}
  .scaleopt{position:absolute;top:-15px;right:22px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
  .chk{width:18px;height:18px;border-radius:5px;background:#736bc9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  .ptbox{border:1px solid var(--sel-bd);border-radius:12px;padding:16px;margin-top:8px}
  .ptbox .th{font-size:15px;font-weight:600;color:var(--sel)}
  .ptbox .ts{font-size:13px;color:var(--ink-3);margin-top:3px}
  .trrow{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:12px;background:#fff}
  .trrow.blue{border-color:#cdddfb;background:#f5f9ff}
  .trrow.purple{border-color:#ddd7f5;background:#faf9ff}
  .trrow.pink{border-color:#f6d3df;background:#fdf6f8}
  .trrow .ic2{font-size:19px;flex:0 0 auto}
  .trrow .tt{flex:1;min-width:0}
  .trrow .tt b{font-size:14px;font-weight:600;display:block}
  .trrow .tt small{font-size:12px;color:var(--ink-3)}
  .pctbox{border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;flex:0 0 auto}
  .linkc{display:flex;justify-content:center;color:#b9bec4;margin:1px 0}
  .disc{margin-top:14px}
  .btable{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:16px}
  .bthead,.btr{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 0.8fr 1.2fr 1.2fr}
  .bthead>div{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--ink-3);padding:13px 16px;text-align:right;text-transform:uppercase;line-height:1.3}
  .btr>div{padding:20px 16px;font-size:14px;text-align:right;border-top:1px solid var(--line-2);color:var(--ink)}
  .btr.blue{background:#f5f9ff}
  .btr.pink{background:#fdf6f8}
  .prodhead{display:flex;align-items:center;gap:10px}
  .histwrap{display:flex;justify-content:center;margin-top:-16px;position:relative;z-index:2}
  .histbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .gnote{width:100%;background:var(--sel-bg);border:1px solid var(--sel-bd);border-radius:10px;padding:11px 14px;font-size:13px;color:#2a4d8f;display:flex;align-items:center;gap:8px;margin-bottom:18px}
  .gnote i{font-size:16px}

  /* ============ strategy layer (merged from hub-v3, restyled) ============ */
  .stratbar{display:flex;align-items:center;gap:10px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);min-height:60px}
  .stabs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
  .stab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;max-width:230px;font-weight:500;transition:border-color .12s}
  .stab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stab:hover{border-color:var(--sel-bd)}
  .stab.on{color:#fff}
  .stab.allst{gap:7px}
  .stab.allst.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .stab .b{background:#eef0f3;color:var(--ink-2);border-radius:8px;font-size:11px;padding:0 6px;font-weight:600}
  .stab.on .b{background:rgba(255,255,255,.25);color:#fff}
  .sdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

  .scopebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding:11px 15px;border:1px solid var(--line);border-radius:11px}
  .scopebar b{color:var(--ink);font-weight:600}.scopebar .sep{color:var(--ink-3)}
  .scopebar .right{margin-left:auto;display:inline-flex;align-items:center;gap:14px}
  .scopebar .applies{color:var(--ink-3);font-size:12px;display:inline-flex;align-items:center;gap:5px}
  .scopebar .del{color:var(--red);font-size:12.5px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;background:transparent;border:0;font:inherit}

/* ================= timeline (shared renderer) ================= */
const WEEKS=["16","23","30","6","13","20","27","4 Nov","11","18"];
const NOW=6;
function line(vals,color,opts={}){
  const n=10,w=1000,h=49,padT=16,padB=15,step=w/n,pts=[];
  vals.forEach((v,i)=>{if(v!==null)pts.push([i*step+step/2,v]);});
  const nums=pts.map(p=>p[1]),mn=Math.min(...nums),mx=Math.max(...nums),yOf=v=>h-padB-((v-mn)/((mx-mn)||1))*(h-padT-padB);
  let segs="";
  for(let k=0;k<pts.length-1;k++){const dash=(opts.dashTail&&k===pts.length-2)?'stroke-dasharray="4 3"':'';segs+=`<line x1="${pts[k][0].toFixed(1)}" y1="${yOf(pts[k][1]).toFixed(1)}" x2="${pts[k+1][0].toFixed(1)}" y2="${yOf(pts[k+1][1]).toFixed(1)}" stroke="${color}" stroke-width="1.6" ${dash}/>`;}
  const area=`<polygon points="${pts.map(p=>p[0].toFixed(1)+','+yOf(p[1]).toFixed(1)).join(' ')} ${pts[pts.length-1][0].toFixed(1)},${h} ${pts[0][0].toFixed(1)},${h}" fill="${color}" opacity="0.1"/>`;
  const dots=pts.map((p,i)=>{const hollow=(opts.hollowLast&&i===pts.length-1);return `<circle cx="${p[0].toFixed(1)}" cy="${yOf(p[1]).toFixed(1)}" r="2.6" fill="${hollow?'#fff':color}" stroke="${color}" stroke-width="1.5"/>`;}).join("");
  const labs=pts.map((p,i)=>{
    const last=i===pts.length-1,pos=opts.pos?opts.pos[i]:(i%2===0?'a':'b');
    const bold=(opts.boldLast&&last)?'700':'500',fs=(opts.boldLast&&last)?15:13;
    const txt=opts.labels?opts.labels[i]:p[1].toLocaleString();
    if(opts.rightLast&&last) return `<text x="${(p[0]+15).toFixed(1)}" y="${(yOf(p[1])+4).toFixed(1)}" text-anchor="start" font-size="${fs}" fill="${color}" font-weight="${bold}" font-family="Figtree">${txt}</text>`;
    const ly=pos==='a'?yOf(p[1])-7:yOf(p[1])+16;
    return `<text x="${p[0].toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="${color}" font-weight="${bold}" font-family="Figtree">${txt}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="${h}" style="display:block;overflow:visible">${area}${segs}${dots}${labs}</svg>`;
}

/* ================= hub ================= */
function stratMetrics(st){
  const d=derive(st),sat=st.def?SAT.default:(SAT[st.stance]||50);
  const spend=Math.round(d.budget*sat/100);
  const netProfit=d.campaigns.reduce((t,c)=>t+(c.np||0),0);
  const acosVals=d.campaigns.filter(c=>c.type==="SP"&&c.cur>0).map(c=>c.cur);
  const acos=acosVals.length?Math.round(acosVals.reduce((a,b)=>a+b,0)/acosVals.length):0;
  const brands=[...new Set(d.campaigns.map(c=>c.brand))];
  return {d,sat,spend,netProfit,acos,roas:acos?(100/acos):0,brands,has:d.sp+d.sb};
}
function pace(sat,has){
  if(!has) return {c:"pace-a",l:"Empty",i:"ti-circle-dashed"};
  if(sat>=90) return {c:"pace-r",l:"Budget saturated",i:"ti-alert-triangle"};
  if(sat<25)  return {c:"pace-a",l:"Under-pacing",i:"ti-arrow-down-right"};
  return {c:"pace-g",l:"Healthy pace",i:"ti-circle-check"};
}
function hubView(){
  const M=strategies.map(st=>({st,m:stratMetrics(st)}));
  const totBudget=M.reduce((t,x)=>t+x.m.d.budget,0);
  const totSpend=M.reduce((t,x)=>t+x.m.spend,0);
  const totProfit=M.reduce((t,x)=>t+x.m.netProfit,0);
  const avgSat=totBudget?Math.round(totSpend/totBudget*100):0;
  const totCamps=CAMPAIGNS.length;
  const def=strategies.find(s=>s.def),unalloc=def?derive(def).campaigns.length:0;
  const assigned=totCamps-unalloc;

  /* rollup strip */
  const hubtop=`<div class="hubtop">
    <div class="stat"><div class="k"><i class="ti ti-coin"></i>Total weekly budget</div><div class="v">${usd(totBudget)}</div><div class="s">across ${strategies.length} strategies</div></div>
    <div class="stat"><div class="k"><i class="ti ti-cash"></i>Est. weekly spend</div><div class="v">${usd(totSpend)}</div><div class="s">${avgSat}% avg saturation</div></div>
    <div class="stat"><div class="k"><i class="ti ti-report-money"></i>Ads net profit · 4W</div><div class="v">${usd(totProfit)}</div><div class="s">all strategies combined</div></div>
    <div class="stat"><div class="k"><i class="ti ti-stack-2"></i>Campaigns assigned</div><div class="v">${assigned}<small> / ${totCamps}</small></div><div class="s ${unalloc?'warn':''}">${unalloc?unalloc+" still in "+dflt():"all campaigns allocated"}</div></div>
  </div>`;

  /* allocation bar */
  const segs=M.filter(x=>x.m.d.budget>0).map(x=>`<span style="width:${(x.m.d.budget/totBudget*100).toFixed(1)}%;background:${colorOf(x.st).dot}" title="${x.st.name}"></span>`).join("");
  const legend=M.filter(x=>x.m.d.budget>0).map(x=>`<span class="lg"><span class="sdot" style="background:${colorOf(x.st).dot}"></span>${x.st.name} <b>${usd(x.m.d.budget)}</b><span class="pctm">· ${Math.round(x.m.d.budget/totBudget*100)}%</span></span>`).join("");
  const alloc=totBudget?`<div class="allocwrap"><div class="ah"><i class="ti ti-chart-pie"></i>How the account budget is split</div><div class="allocbar">${segs}</div><div class="alloclegend">${legend}</div></div>`:"";

  /* insights: auction overlap + unallocated */
  const nd=M.filter(x=>!x.st.def);
  const ins=[];
  for(let i=0;i<nd.length;i++)for(let j=i+1;j<nd.length;j++){
    const shared=nd[i].m.brands.filter(b=>nd[j].m.brands.includes(b));
    if(shared.length) ins.push(`<div class="insight warn"><i class="ti ti-alert-triangle"></i><span><b>Auction overlap:</b> “${nd[i].st.name}” and “${nd[j].st.name}” both run <b>${shared.join(", ")}</b> campaigns — they may bid against each other on the same keywords.</span></div>`);
  }
  if(unalloc) ins.push(`<div class="insight info"><i class="ti ti-info-circle"></i><span><b>${unalloc} campaign${unalloc>1?'s':''}</b> ${unalloc>1?'are':'is'} still in <b>${dflt()}</b> and not in a dedicated strategy.</span><button class="act" data-strat="default">Review →</button></div>`);
  const insights=ins.length?`<div class="insights">${ins.join("")}</div>`:"";

  /* enriched cards */
  const cards=M.map(({st,m})=>{const c=colorOf(st),p=pace(m.sat,m.has);
    return `<div class="hcard" data-strat="${st.id}" style="border-top-color:${c.dot}"><div class="pad">
        <div class="top"><span class="nm"><span class="sdot" style="background:${c.dot}"></span>${dName(st)}</span><span class="stance ${st.stance}" style="margin-left:auto"><i class="ti ${STANCE[st.stance].i}"></i>${STANCE[st.stance].l}</span></div>
        <div class="big">${usd(m.d.budget)}<small> /week</small></div>
        <div class="mix"><i class="ti ti-stack-2" style="font-size:14px;color:var(--ink-3)"></i>${m.d.sp} Sponsored Product + ${m.d.sb} Sponsored Brand</div>
        ${m.brands.length?`<div class="brands">${m.brands.map(b=>`<span class="btag">${b}</span>`).join("")}</div>`:""}
        <div class="kvs">
          <span class="kv">ACOS <b>${m.acos?m.acos+'%':'—'}</b></span>
          <span class="kv ${m.netProfit>0?'g':(m.netProfit<0?'r':'')}">Net profit <b>${m.has?usd(m.netProfit):'—'}</b></span>
        </div>
        <div class="sat"><div class="satr"><span class="pace ${p.c}"><i class="ti ${p.i}"></i>${p.l}</span><span>${m.has?m.sat+'% saturation':'—'}</span></div><div class="bar"><span style="width:${m.has?m.sat:0}%;background:${c.dot}"></span></div></div></div>
      <div class="mini"><div>Spend<b>${usd(m.spend)}</b></div><div>Campaigns<b>${m.has}</b></div><div>Products<b>${m.d.sp}</b></div></div>
      <div class="open">Open &amp; edit settings <i class="ti ti-arrow-right"></i></div></div>`;}).join("");

  return `<p class="hub-sub">Compare how investment is split across your brands in this one Amazon account — budget, pacing, and efficiency side by side. Open a strategy to manage its settings.</p>
    ${hubtop}${alloc}${insights}
    <div class="hub">${cards}<div class="hcard add" data-create="1"><i class="ti ti-plus"></i>Create strategy</div></div>`;
}

    <p class="isub">How should strategies be structured inside this one Amazon account? Pick a starting concept — you can switch anytime from the top bar.</p>
    <div class="intro-cards">
      ${["c1","c2","c3"].map((k,idx)=>{const C=CONCEPTS[k],accent=idx===0?'var(--sel)':idx===1?'var(--create)':'#22863d',abg=idx===0?'var(--sel-bg)':idx===1?'#efeafe':'#e7f4ec';
        return `<div class="icard" data-pick="${k}" style="--ia:${accent};--iab:${abg}">
          <span class="ico"><i class="ti ${C.icon}"></i></span>
          <span class="badge">${C.tab} · ${meta[k].tag}</span>
          <h3>${C.title}</h3>
          <p>${meta[k].body}</p>
          <span class="go">Open this concept <i class="ti ti-arrow-right"></i></span>
        </div>`;}).join("")}
    </div>
    <p class="ifoot"><i class="ti ti-refresh"></i>Switch concepts anytime from the version dropdown beside the account selector.</p>
  </div>`;
  introEl.querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{concept=el.dataset.pick;seedDemo();introEl.classList.add("off");render();});
  introEl.classList.remove("off");
}

scrim.onclick=closeSlider;
document.addEventListener("click",e=>{if(cdd&&!e.target.closest(".verswitch")){cdd=false;render();}if(openAssign!==null&&!e.target.closest(".asel-wrap")){openAssign=null;render();}if(c3fopen&&!e.target.closest(".filter")){c3fopen=false;render();}if(c3popWeek!=null&&!e.target.closest(".popover")&&!e.target.closest("[data-week]")){c3popWeek=null;render();}if(noteOpen&&!e.target.closest(".notewrap")){noteOpen=false;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSlider();if(cdd){cdd=false;render();}if(view.confirmDel){view.confirmDel=false;render();}}});
renderIntro();
</script>
</body>
</html>
