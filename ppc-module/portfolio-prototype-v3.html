<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Management — Portfolios (Omny) · v5</title>
<style>
  :root{
    /* ===== Figma design tokens (PPC – Omny) ===== */
    /* blue / accent */
    --accent:#2172e1;--accent-weak:#f4f8ff;--accent-bd:#8ab4ff;--blue-100:#edf5ff;--blue-300:#adcdff;--blue-500:#669eff;--blue-600:#4c8eff;--band-bg:#f0f6ff;
    /* ink / greys */
    --ink:#3d3d3d;--ink-2:#757575;--ink-3:#999999;--ink-strong:#2e2e2e;--grey-1000:#4d4d4d;
    --line:#eeeeee;--line-2:#e3e3e3;--grey-400:#d1d1d1;--grey-500:#bfbfbf;
    --panel:#fafafa;--panel-2:#f8f9ff;--cool-100:#f2f4f8;--cool-150:#e8ebf3;--cool-200:#dde1e6;--cool-700:#71777f;
    /* portfolio / brand (indigo) */
    --pf:#5a52ae;--pf-bg:#f3eeff;--pf-bd:#e4dfff;--pf-hover:#f8f9ff;--pf-strong:#312783;--pf-700:#8d85e5;
    /* purple / lavender */
    --lav:#f6f2ff;--lav-2:#ece7fa;--purple:#b885ff;--purple-bg:#f6f2ff;
    /* data */
    --blue-line:#2f90de;--green:#22863d;--green-600:#47d16c;--green-100:#defbe6;--red:#db333b;--red-50:#fff0f1;
    --amber:#f0c329;--amber-700:#8f710a;--yellow-200:#faebb7;--orange:#ff8933;--orange-500:#ff9d57;--orange-100:#fff2e8;
    /* misc */
    --primary:#22863d;--primary-h:#1c6f33;--gold:#c8b06b;--rail:#191a1c;--rail-ink:#8b8f96;
    --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow-card:0 1px 2px rgba(16,24,40,.05);
    /* radii */
    --r-lg:12px;--r:8px;--r-sm:4px;
    /* layout: page container bg + one consistent padding step */
    --page-bg:#fafafa;--pad:24px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:60px minmax(0,1fr);min-height:100vh}
  .rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:22px;position:sticky;top:0;height:100vh}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#2a230c;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
  .rail i{color:var(--rail-ink);font-size:19px;cursor:pointer}.rail i:hover{color:#cfd3d9}.rail .active-i{color:#fff}.rail .spacer{flex:1}
  .main{padding:0;width:100%;min-width:0}
  /* one container for everything below nav2 — Figma section-wrapper */
  .pagewrap{background:var(--page-bg);padding:var(--pad);display:flex;flex-direction:column;gap:20px;min-width:0}
  .tip{position:relative}
  .tt{position:fixed;background:#2e2e2e;color:#fff;font-size:12px;line-height:1.45;padding:8px 11px;border-radius:var(--r);white-space:normal;max-width:260px;text-align:left;z-index:200;box-shadow:0 8px 22px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;font-family:var(--sans);font-weight:500}
  .tt.on{opacity:1;transform:none}

  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0;padding:18px var(--pad) 14px}
  .h-title{font-size:19px;font-weight:600;letter-spacing:-.2px}
  .selector{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-size:13px}
  .selector .badge{background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
  .flag{width:18px;height:12px;border-radius:2px;display:inline-block}
  .nav2{display:flex;gap:8px;margin:0;padding:0 var(--pad) 12px;border-bottom:1px solid var(--line-2)}
  .nav2 a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);font-size:14px;color:var(--ink-2);cursor:pointer}
  .nav2 a i{font-size:18px}.nav2 a:hover:not(.on){background:#f6f7f9}
  .nav2 a.on{background:#f4f4f4;color:var(--ink);font-weight:500}

  .cardswrap{position:relative;margin:26px 0 0;background:var(--band-bg);border:1px solid var(--blue-300);border-bottom:0;border-radius:var(--r) var(--r) 0 0;padding:6px 6px 0}
  /* Figma: pill sits flush ABOVE the band top edge (tab), not overlapping it */
  .pause{position:absolute;top:0;left:0;right:0;transform:translateY(-100%);display:flex;justify-content:center;z-index:3;pointer-events:none}
  .pause button{pointer-events:auto;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:14px;font-weight:500;color:var(--blue-500);background:linear-gradient(180deg,var(--blue-100),var(--band-bg));border:1px solid var(--blue-300);border-bottom:0;border-radius:6px 6px 0 0;padding:5px 8px 4px;cursor:pointer}
  .pause button i{font-size:16px}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border:1px solid var(--cool-150);border-radius:var(--r) var(--r) 0 0;overflow:hidden}
  .setcard{padding:16px 20px;border-right:1px solid var(--cool-150);position:relative;cursor:pointer;transition:background .12s}
  .setcard:last-child{border-right:0}.setcard:hover:not(.on){background:#fafbfc}
  .setcard.on{background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent-bd);border-radius:var(--r) var(--r) 0 0}
  .setcard .r1{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ink);line-height:1.2}
  .setcard .r1 i{font-size:20px;color:var(--ink)}
  .setcard.on .r1{color:var(--accent);font-weight:600}.setcard.on .r1 i{color:var(--accent)}
  .setcard p{margin:4px 0 0 28px;font-size:15px;color:var(--ink-3);line-height:1.4}
  .setcard.on p{color:var(--ink-2)}
  .uline{height:0;margin:0}

  /* ============ PORTFOLIO STRIP (in content, below cards) ============ */
  .pstrip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:11px 13px;margin:0;box-shadow:var(--shadow-card);flex-wrap:wrap;position:relative;z-index:20}
  .pgridbtn{width:42px;height:42px;flex:0 0 auto;border:0;border-radius:11px;background:var(--pf-bg);color:var(--pf);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .13s,transform .1s}
  .pgridbtn i{font-size:21px}
  .pgridbtn:hover{background:#e4e0f9}
  .pgridbtn:active{transform:scale(.96)}
  .pgridbtn.on{background:var(--pf);color:#fff}
  .pdiv{width:1px;height:26px;background:var(--line-2);flex:0 0 auto}
  .plabel{font-size:11.5px;font-weight:700;letter-spacing:1.3px;color:var(--ink-3);white-space:nowrap}
  .ppills{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
  .ppill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-2);background:#fff;border-radius:11px;padding:9px 15px;font-size:14px;color:var(--ink);cursor:pointer;transition:border-color .13s,background .13s;max-width:300px;position:relative}
  .ppill:hover{border-color:var(--pf-bd);background:var(--pf-hover)}
  .ppill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .ppill .sub{color:var(--ink-3);font-weight:400}
  .ppill.on{background:var(--pf-bg);border-color:var(--pf-bd);color:var(--pf)}
  .ppill.on .nm{font-weight:600}
  .ppill.on .sub{color:#8d84dd}
  .ppill i.lead{font-size:17px;color:var(--ink-2)}
  .ppill.on i.lead{color:var(--pf)}
  .sdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pdots{border:0;background:transparent;color:var(--pf);cursor:pointer;padding:0 0 0 3px;font-size:17px;line-height:1;display:inline-flex;align-items:center;opacity:.75;border-radius:5px}
  .pdots:hover{opacity:1}
  .pnew{font-size:10px;background:#e6f6ec;color:#1f8a4c;border-radius:5px;padding:1px 6px;font-weight:700}
  .pcreate{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:14px;color:var(--pf);background:#fff;border:1px solid var(--pf-bd);border-radius:11px;padding:10px 17px;cursor:pointer;transition:background .13s;white-space:nowrap}
  .pcreate:hover{background:var(--pf-hover)}
  .pcreate i{font-size:18px}

  .pmenu{position:absolute;top:calc(100% + 8px);background:#fff;border:1px solid var(--line-2);border-radius:12px;box-shadow:0 14px 40px rgba(16,24,40,.18);z-index:60;padding:6px;width:250px;display:none}
  .pmenu.on{display:block}
  .pmi{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--ink)}
  .pmi:hover{background:var(--panel)}
  .pmi i{font-size:18px;color:var(--ink-2)}
  .pmi .hint{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
  .pmi.danger{color:var(--red)}.pmi.danger i{color:var(--red)}
  .pmi.danger:hover{background:#fdf1f0}
  .pmsep{height:1px;background:var(--line);margin:4px 4px}

  .stripnote{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px dashed var(--line-2);border-radius:11px;padding:11px 14px;margin-top:-10px;font-size:12.5px;color:var(--ink-2)}
  .stripnote i{font-size:16px;color:var(--ink-3)}
  .stripnote b{font-weight:600;color:var(--ink)}

  /* white card shell wrapping each table (header + body) */
  .tcard{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;min-width:0}
  .exhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0;background:#fff;border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:16px 24px}
  .exhead .title{font-size:16px;font-weight:600;color:var(--ink-strong);white-space:nowrap;line-height:1.4}
  .exhead .cw{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .exhead .cw i{font-size:15px}
  .exhead .grow{flex:1}
  .exhead .scopetag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;border-radius:8px;padding:5px 11px}
  .createstrat{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--pf-strong);color:var(--pf-strong);background:#fff;border-radius:var(--r);padding:8px 16px 8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s}
  .createstrat i{font-size:20px}
  .createstrat:hover{background:var(--pf-hover)}

  /* ============ no-data state (new portfolio) ============ */
  .nodata{border:0;border-radius:0;background:#fff;padding:38px 26px;text-align:center}
  .nodata .ic{width:52px;height:52px;border-radius:14px;background:var(--pf-bg);color:var(--pf);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .nodata .ic i{font-size:26px}
  .nodata h4{margin:0 0 7px;font-size:15.5px;font-weight:600}
  .nodata p{margin:0 auto;font-size:13px;color:var(--ink-3);line-height:1.55;max-width:480px}
  .nodata .steps{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .nstep{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--ink-2)}
  .nstep i{font-size:15px;color:var(--pf)}
  .nstep b{color:var(--ink);font-weight:600}

  .scrollx{overflow-x:auto}
  /* ===== timeline: real week grid, bounded scroll, sticky label ===== */
  .tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
  .tl{background:#fff;border:0;border-radius:0;position:relative;min-width:max-content}
  .tlrow{display:grid;grid-template-columns:180px repeat(var(--nw),minmax(92px,1fr));border-bottom:1px solid var(--line);align-items:stretch;position:relative;z-index:1;background:transparent}
  .tlrow:last-child{border-bottom:0}
  .tlrow .lab{position:sticky;left:0;z-index:6;background:#fff;font-size:13px;color:var(--ink-2);text-align:right;
    padding:0 16px;min-height:44px;display:flex;align-items:center;justify-content:flex-end;gap:5px;line-height:1.25}
  .tl.scrolled .tlrow .lab{border-right:1px solid var(--line-2);box-shadow:8px 0 14px -8px rgba(16,24,40,.28)}
  .wc{display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;color:var(--ink);min-height:44px;position:relative}
  .wc.hd{font-size:13px;color:var(--ink-2);min-height:38px}
  .wc b{font-weight:600}.wc .d{font-size:11.5px;font-weight:600}
  .sdotx{width:10px;height:10px;border-radius:50%;display:inline-block}
  .area{grid-column:2 / -1;position:relative}
  .linewrap{position:relative;width:100%}
  .ptlab{position:absolute;font-size:12px;font-weight:600;white-space:nowrap;letter-spacing:-.1px}
  /* column overlay: separators + current week + hover highlight (visual only) */
  .ovlay{position:absolute;inset:0;display:grid;grid-template-columns:180px repeat(var(--nw),minmax(92px,1fr));pointer-events:none;z-index:0}
  .ovlay .ov{border-left:1px solid var(--line)}
  .ovlay .ov.now{background:var(--lav)}
  .ovlay .ov.hot{background:rgba(47,107,243,.06)}
  .ovlay .ov.past.hot{background:rgba(0,0,0,.035)}
  .wc.now,.wc.hd.now{background:transparent}
  /* strategy row */
  .srow{min-height:56px}
  .sstrip{grid-row:1;margin:7px 4px;display:flex;align-items:center;gap:2px;padding:0 10px;border:1px solid var(--line-2);
    border-radius:var(--r);background:#fff;position:relative;z-index:4;min-height:34px;transition:border-color .12s,box-shadow .12s}
  .sstrip:hover{border-color:var(--blue-300);box-shadow:0 1px 4px rgba(16,24,40,.1)}
  .sstrip.ro{background:var(--panel);color:var(--ink-3)}
  .sstrip.ro .vchip{background:#eef0f3;border-color:var(--line-2);color:var(--ink-2)}
  .sstrip.ro:hover{border-color:var(--line-2);box-shadow:none}
  .sacts{display:none;align-items:center;gap:4px;margin-left:auto}
  .sstrip:hover .sacts{display:inline-flex}
  .sact{width:26px;height:26px;border:1px solid var(--line-2);background:#fff;border-radius:6px;color:var(--ink-2);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .sact i{font-size:15px}
  .sact:hover{background:var(--blue-100);border-color:var(--blue-300);color:var(--accent)}
  .sact.del:hover{background:var(--red-50);border-color:#f3c8c9;color:var(--red)}
  /* create-strategy affordance in a free active/future column */
  .sfree{z-index:4;padding:0}
  .mkstrat{display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:absolute;
    inset:5px 4px;border:1px dashed var(--pf-bd);border-radius:var(--r);background:#fdf1f0;color:var(--pf-strong);
    font:inherit;font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;cursor:pointer}
  .mkstrat i{font-size:15px}
  .mkstrat:hover{background:#f8ecf9;border-color:var(--pf)}
  .srow .sfree:hover .mkstrat{display:flex}
  .vchip{display:inline-flex;align-items:center;gap:5px;background:var(--blue-100);border:1px solid var(--blue-300);color:var(--accent);border-radius:var(--r-sm);font-size:13px;padding:3px 9px;font-weight:500;white-space:nowrap}
  .vpct{font-size:13px;color:var(--ink-2);font-weight:500;margin-left:7px;white-space:nowrap}
  .tl.ro .mkstrat,.tl.ro .sacts{display:none !important}

  .alloc-h{display:flex;align-items:center;gap:10px;margin:0;padding:16px 24px 0}
  .alloc-h .grow{flex:1;min-width:8px}
  .alloc-h h2{margin:0}
  .alloc-h i{font-size:20px;color:var(--ink-2)}.alloc-h h2{font-size:17px;font-weight:600;margin:0}
  .alloc-sub{font-size:12.5px;color:var(--ink-3);margin:0;padding:4px 24px 14px 54px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ptable{background:#fff;border:0;border-top:1px solid var(--line-2);border-radius:0;overflow:hidden;min-width:1620px}
  .pgrid{display:grid;grid-template-columns:44px 54px 34px minmax(306px,1fr) 96px 100px 96px 78px 100px 108px 96px 96px 108px 96px 96px}
  .pgrid > div{padding:10px;font-size:12.5px;border-bottom:1px solid #f1f2f5;border-right:1px solid var(--line);display:flex;align-items:center;position:relative;transition:background .1s}
  .pgrid > div:nth-child(15n){border-right:0}
  /* cell + column hover */
  .pgrid > div.colhl,.tlcell.colhl{background-color:#f0f4fb}
  .pgrid > div.cellhl,.tlcell.cellhl{background-color:#edf5ff;box-shadow:inset 0 0 0 1px #adcdff}

  .bannerrow > div{min-height:40px;padding:0;border-bottom:1px solid var(--line)}
  .banner-amt{grid-column:10 / 16;background:#fdf3e6;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:12.5px;color:var(--amber)}
  .banner-amt b{color:#b56a12;font-size:16px}
  .totalrow > div{background:var(--lav);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2);min-height:46px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
  .totalrow .amt{font-weight:600;color:var(--ink);font-size:13px}.totalrow .pos{color:var(--green);font-size:11.5px}
  .totalrow .cpy{color:var(--ink-3);font-size:11px;display:inline-flex;align-items:center;gap:4px}
  .toolrow > div{border-bottom:1px solid var(--line);min-height:52px}
  .tool-l{grid-column:1 / 6;padding:0 14px;display:flex;align-items:center}
  .searchbox{position:relative;width:100%;max-width:360px}
  .searchbox i{position:absolute;left:12px;top:10px;color:var(--ink-3);font-size:17px}
  .searchbox input{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:9px 12px 9px 36px;font:inherit;font-size:13px}
  .tool-prio{grid-column:6 / 7;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
  .prioritized{background:#eef0f3;color:var(--ink-2);border-radius:8px;font-size:11.5px;padding:5px 11px;display:inline-flex;align-items:center;gap:5px}
  .tool-roas{grid-column:7 / 10;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;gap:9px}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
  .sw{width:38px;height:21px;border-radius:11px;background:var(--accent);position:relative}
  .sw::after{content:"";position:absolute;top:2.5px;right:2.5px;width:16px;height:16px;border-radius:50%;background:#fff}
  .orange-l{box-shadow:inset 2px 0 0 var(--orange)}.orange-r{box-shadow:inset -2px 0 0 var(--orange)}
  .grouprow > div{background:#fafbfc;border-bottom:1px solid var(--line);color:var(--ink-3);font-size:11px;min-height:34px}
  .headrow > div{background:#fff;border-bottom:1px solid var(--line);color:var(--ink-3);font-size:11.5px;font-weight:500;min-height:46px;align-items:flex-end;line-height:1.25}
  .headrow .num{justify-content:flex-end;text-align:right}
  .col-perf{background:var(--lav) !important}
  .col-perf.colhl{background-color:#eae3fa !important}
  .col-perf.cellhl{background-color:#ded3f8 !important;box-shadow:inset 0 0 0 1px #b885ff}
  .pgrp{gap:11px}
  .pthumb{width:36px;height:36px;border-radius:8px;flex:0 0 auto;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .pname{font-size:12.5px;line-height:1.25}
  .pname .meta{display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:10.5px;margin-top:4px}
  .pfchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;font-size:10.5px;padding:2px 8px;margin-top:5px;width:max-content}
  .ic{color:var(--ink-3);font-size:17px}
  .num{justify-content:flex-end}
  .mult{color:var(--accent);font-weight:600}.amt{font-weight:600}.sub2{color:var(--ink-3);font-size:10.5px}
  .col2{flex-direction:column;align-items:flex-end;justify-content:center;gap:2px}
  .circ{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--green);display:inline-block;flex:0 0 auto}
  .gtoggle{width:38px;height:21px;border-radius:11px;background:var(--green);position:relative;flex:0 0 auto}
  .gtoggle::after{content:"";position:absolute;top:2.5px;left:19px;width:16px;height:16px;border-radius:50%;background:#fff}
  .gtoggle.off{background:#cfd4db}.gtoggle.off::after{left:2.5px}
  .empty-t{padding:44px 26px;text-align:center;color:var(--ink-3);font-size:13px}

function stats(id){const r=productsOf(id);return{n:r.length,budget:r.reduce((t,x)=>t+x.p.budget,0),
  campaigns:r.reduce((t,x)=>t+x.p.campaigns,0),isNew:r.filter(x=>x.p.isNew).length};}
/* deterministic per-portfolio weekly series: allocated vs utilised */
function series(id){
  const s=stats(id);if(!s.budget)return null;
  const seed=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const out=[];for(let w=0;w<8;w++){
    const wob=0.82+((Math.sin(seed+w*1.7)+1)/2)*0.38;
    const alloc=Math.round(s.budget*wob);
    const rate=0.52+((Math.sin(seed*1.3+w*2.1)+1)/2)*0.46;
    out.push({alloc,used:Math.round(alloc*Math.min(1.04,rate))});}
  return out;
}

/* ===================== timeline / no-data ===================== */
function weekData(pf){
  const st=stats(pf.id),base=st.budget||2600,seed=[...pf.id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const out=[];
  for(let i=0;i<NW;i++){
    const seg=segAt(pf,i);
    if(!seg||i>NOWI){out.push(null);continue;}          /* future = strategy not applied yet */
    const w=0.78+((Math.sin(seed+i*1.7)+1)/2)*0.5;
    const avail=Math.round(base*w);
    const spend=Math.round(avail*(0.42+((Math.sin(seed*1.3+i*2.1)+1)/2)*0.52));
    out.push({avail,spend,ratio:spend/avail,
      prods:Math.max(1,Math.round((st.n||6)*(0.65+((Math.sin(seed+i*1.1)+1)/2)*0.45)))});
  }
  return out;
}
function tlLine(vals,key,color,o={}){
  const H=58,padT=22,padB=14,pts=[];
  vals.forEach((v,i)=>{if(v)pts.push([(i+0.5)/NW*100,v[key]]);});
  if(!pts.length)return `<div class="linewrap" style="height:${H}px"></div>`;
  const ns=pts.map(p=>p[1]),mn=Math.min(...ns,0),mx=Math.max(...ns,1);
  const yOf=v=>H-padB-((v-mn)/((mx-mn)||1))*(H-padT-padB);
  let segs="";
  for(let k=0;k<pts.length-1;k++)
    segs+=`<line x1="${pts[k][0]}%" y1="${yOf(pts[k][1]).toFixed(1)}" x2="${pts[k+1][0]}%" y2="${yOf(pts[k+1][1]).toFixed(1)}" stroke="${color}" stroke-width="2"/>`;
  const dots=pts.map(p=>`<circle cx="${p[0]}%" cy="${yOf(p[1]).toFixed(1)}" r="3.2" fill="${color}" stroke="${color}" stroke-width="2"/>`).join("");
  const labs=pts.map(p=>`<span class="ptlab" style="left:${p[0]}%;top:${(yOf(p[1])-15).toFixed(1)}px;color:${color};transform:translateX(-50%)">${p[1].toLocaleString()}</span>`).join("");
  return `<div class="linewrap" style="height:${H}px">
    <svg width="100%" height="${H}" style="display:block;position:absolute;inset:0;overflow:visible">${segs}${dots}</svg>${labs}</div>`;
}
function timeline(pfArg,ro){
  const pf=pfArg||activePf(),data=weekData(pf),readOnly=!!ro;
  const cell=i=>`<div class="wc ${i===NOWI?'now':''} ${i<NOWI?'past':''}"></div>`;
  /* --- strategy row: strips span their week range; free weeks are hover targets --- */
  let sr="",i=0;
  while(i<NW){
    const seg=segAt(pf,i);
    if(seg&&seg.from===i){
      const past=seg.to<=NOWI, span=`grid-column:${i+2} / ${Math.min(seg.to,NW)+2}`;
      sr+=`<div class="sstrip ${past?'ro':''}" style="${span}" data-seg="${seg.id}">
        <span class="vchip"><i class="ti ti-wave-sine"></i>${seg.mode}</span><span class="vpct">${seg.pct}</span>
        ${(!past&&!readOnly)?`<span class="sacts">
            <button class="sact" data-sedit="${seg.id}" title="Edit strategy"><i class="ti ti-pencil"></i></button>
            <button class="sact del" data-sdel="${seg.id}" title="Delete strategy"><i class="ti ti-trash"></i></button></span>`:''}
      </div>`;
      i=Math.min(seg.to,NW);
    } else if(seg){ i++; }
    else {
      sr+=`<div class="wc sfree ${i===NOWI?'now':''} ${i<NOWI?'past':''}" data-wk="${i}" style="grid-column:${i+2}">
        ${(i>=NOWI&&!readOnly)?`<button class="mkstrat" data-mkstrat="${i}"><i class="ti ti-plus"></i><span>Create<br>strategy</span></button>`:''}</div>`;
      i++;
    }
  }
  const sat=data.map((d,i)=>`<div class="wc ${i===NOWI?'now':''}">${d?`<span class="sdotx" style="background:${d.ratio>0.9?'var(--green)':d.ratio>0.6?'var(--amber)':'var(--red)'}"></span>`:''}</div>`).join("");
  const pa=data.map((d,i)=>{
    if(!d)return `<div class="wc ${i===NOWI?'now':''}"></div>`;
    const prev=i>0&&data[i-1]?data[i-1].prods:null,dv=prev===null?null:d.prods-prev;
    return `<div class="wc ${i===NOWI?'now':''}"><b>${d.prods}</b>${dv===null?'':`<span class="d" style="color:${dv>0?'var(--green)':dv<0?'var(--red)':'var(--ink-3)'}">${dv>0?'+'+dv:dv===0?'=':dv}</span>`}</div>`;}).join("");
  const heads=WEEKS.map((w,i)=>`<div class="wc hd ${i===NOWI?'now':''}">${w}</div>`).join("");
  const overlay=WEEKS.map((_,i)=>`<div class="ov ${i===NOWI?'now':''} ${i<NOWI?'past':''}" data-ovc="${i}" style="grid-column:${i+2}"></div>`).join("");
  return `<div class="scrollx tlscroll"><div class="tl ${readOnly?'ro':''}" style="--nw:${NW}">
    <div class="ovlay">${overlay}</div>
    <div class="tlrow"><div class="lab"></div>${heads}</div>
    <div class="tlrow srow"><div class="lab">Strategy</div>${sr}</div>
    <div class="tlrow"><div class="lab">Weekly budget<br>available (in $)</div><div class="area">${tlLine(data,"avail","var(--blue-line)")}</div></div>
    <div class="tlrow"><div class="lab">Spend (in $)</div><div class="area">${tlLine(data,"spend","var(--purple)")}</div></div>
    <div class="tlrow"><div class="lab">Budget saturation</div>${sat}</div>
    <div class="tlrow"><div class="lab">Products activated</div>${pa}</div>
  </div></div>`;
}

/* ===================== MANAGE (cards + week graphs) ===================== */
function miniChart(id,dot){
  const data=series(id);
  if(!data)return null;
  const w=300,h=64,n=data.length,gap=7,bw=(w-gap*(n-1))/n;
  const max=Math.max(...data.map(d=>d.alloc))||1;
  let bars="";
  data.forEach((d,i)=>{
    const x=i*(bw+gap),ah=Math.max(3,(d.alloc/max)*(h-14)),uh=Math.max(2,(d.used/max)*(h-14));
    bars+=`<rect x="${x.toFixed(1)}" y="${(h-ah).toFixed(1)}" width="${bw.toFixed(1)}" height="${ah.toFixed(1)}" rx="3" fill="${dot}" opacity="0.17"/>`;
    bars+=`<rect x="${x.toFixed(1)}" y="${(h-uh).toFixed(1)}" width="${bw.toFixed(1)}" height="${uh.toFixed(1)}" rx="3" fill="${dot}"/>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="64" preserveAspectRatio="none" style="display:block">${bars}</svg>`;
}

  return `<div class="pcard" style="border-top-color:${c.dot}">

      <div class="pc-name">${p.def?`<i class="ti ti-inbox" style="color:var(--ink-3);font-size:18px"></i>`:`<span class="sdot" style="background:${c.dot}"></span>`}

        <i class="ti ti-git-branch"></i>${st.campaigns} campaign${st.campaigns===1?'':'s'}${st.isNew?` <span class="pnew">${st.isNew} new</span>`:''}</div>
    </div>
    ${chart?`<div class="pc-chart">

  if(sa)sa.onclick=e=>{e.stopPropagation();
    const all=vis.every(({i})=>allocState.sel.has(i));
    vis.forEach(({i})=>all?allocState.sel.delete(i):allocState.sel.add(i));renderAllocList();};
  const cf=document.getElementById("clearf");
  if(cf)cf.onclick=()=>{allocState.q="";allocState.brand="All";document.getElementById("aq").value="";
    host.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x.dataset.brand==="All"));renderAllocList();};
}
function toggleSel(i,row){
  if(allocState.sel.has(i))allocState.sel.delete(i);else allocState.sel.add(i);
  renderAllocList();
}

function reRenderAlloc(){modal&&modal.type==="allocall"?renderAllocAllList():renderAllocList();}
function moveOne(i,toId){const from=pfOf(i);if(from===toId)return;
  lastMove={items:[{i,from}]};if(toId==="default")delete assign[i];else assign[i]=toId;
  reRenderAlloc();
  toast(toId===NOPF?`“${PRODUCTS[i].name}” removed from all ${LABEL}s.`
                   :`“${PRODUCTS[i].name}” moved to ${findPf(toId).name}.`,true);}
function moveMany(idxs,toId){
  const items=idxs.map(i=>({i,from:pfOf(i)})).filter(x=>x.from!==toId);
  if(!items.length){allocState.sel.clear();renderAllocList();return;}
  lastMove={items};items.forEach(({i})=>{if(toId==="default")delete assign[i];else assign[i]=toId;});
  allocState.sel.clear();renderAllocList();
  toast(`${items.length} product${items.length===1?'':'s'} moved to ${findPf(toId).name}.`,true);}
function commitAlloc(){
  const id=allocState.focusPf;
  if(!id){closeModal(true);return;}
  const pf=findPf(id);
  /* products being pulled out of another NAMED portfolio need confirmation */
  const steal=[...allocState.sel].filter(i=>{const c=pfOf(i);
    return c!==id&&c!==NOPF&&!findPf(c).def;}).map(i=>({i,from:pfOf(i)}));
  if(steal.length){confirmSteal(pf,steal,()=>applyAlloc(id));return;}
  applyAlloc(id);
}
function applyAlloc(id){
  const pf=findPf(id),isDef=!!pf.def;const items=[];let added=0,removed=0;
  PRODUCTS.forEach((p,i)=>{
    const cur=pfOf(i),isIn=cur===id,want=allocState.sel.has(i);
    if(want&&!isIn){items.push({i,from:cur});if(isDef)delete assign[i];else assign[i]=id;added++;}
    else if(!want&&isIn){items.push({i,from:cur});if(isDef)assign[i]=NOPF;else delete assign[i];removed++;}
  });
  if(items.length)lastMove={items};
  closeModal(true);
  if(!added&&!removed){toast(`No changes to \u201c${pf.name}\u201d.`);return;}
  const parts=[];
  if(added)parts.push(`${added} product${added===1?'':'s'} added`);
  if(removed)parts.push(`${removed} removed`);
  toast(`${parts.join(" \u00b7 ")} \u2014 \u201c${pf.name}\u201d now has ${stats(id).n}.`,true);
}
function confirmSteal(pf,steal,proceed){
  const by={};steal.forEach(({from})=>{by[from]=(by[from]||0)+1;});
  const lines=Object.entries(by).map(([fid,n])=>{const f=findPf(fid),c=colorOf(f);
    return `<div class="stealrow"><span class="pfchip2" style="background:${c.bg};color:${c.txt}">
      <span class="sdot" style="background:${c.dot}"></span>${f.name}</span>
      <span class="stealn">\u2192 ${n} product${n===1?'':'s'} will move out</span></div>`;}).join("");
  openModal(`<div class="mbox sm">
    <div class="mhead"><span class="hic" style="background:var(--yellow-200);color:var(--amber-700)"><i class="ti ti-transfer"></i></span>
      <div><h3>Move products between ${LABEL}s?</h3>
        <p>A product belongs to one ${LABEL} at a time, so these will leave their current ${LABEL} and its budget.</p></div>
      <button class="x" id="csx">\u00d7</button></div>
    <div class="mbody">${lines}
      <div class="warnbox" style="margin-top:14px"><i class="ti ti-info-circle"></i>
        <span>They will be budgeted under <b>\u201c${pf.name}\u201d</b> from the next allocation run.</span></div></div>
    <div class="mfoot"><span class="grow"></span><button class="btn" id="csno">Cancel</button>
      <button class="btn pf" id="csyes"><i class="ti ti-check"></i>Move products</button></div></div>`);
  document.getElementById("csx").onclick=()=>closeModal(false);
  document.getElementById("csno").onclick=()=>closeModal(false);
  document.getElementById("csyes").onclick=()=>proceed();
}
function undoMove(){if(!lastMove)return;
  lastMove.items.forEach(({i,from})=>{if(from==="default")delete assign[i];else assign[i]=from;});
  lastMove=null;hideToast();
  if(modal&&(modal.type==="alloc"||modal.type==="allocall"))reRenderAlloc();else render();}

/* --- 2b) MANAGE ALL PRODUCTS (dropdown-driven, no checkboxes) --- */
function openAllocAll(){
  allocState={q:"",brand:"All",sel:new Set(),base:new Set(),focusPf:null};
  modal={type:"allocall"};
  openModal(`<div class="mbox lg">
    <div class="mhead"><span class="hic"><i class="ti ti-package"></i></span>
      <div><h3>Manage products</h3>
        <p>Use the ${LABEL_C} dropdown on each row to move a product between ${LABEL}s, or remove it from all of them.
           A product belongs to one ${LABEL} at a time \u2014 changes apply immediately.</p></div>
      <button class="x" id="mx">\u00d7</button></div>
    <div class="mbody">
      <div class="alloctools">
        <div class="asearch"><i class="ti ti-search"></i><input type="text" id="aq" placeholder="Search products or ASIN\u2026"></div>
        ${BRANDS.map(b=>`<span class="fchip ${b==="All"?'on':''}" data-brand="${b}">${b}</span>`).join("")}
        <span style="flex:1"></span><span class="acount" id="acount"></span></div>
      <div id="alist"></div></div>
    <div class="mfoot"><span class="acount" id="afoot"></span><span class="grow"></span>
      <button class="btn green" id="mdone3"><i class="ti ti-check"></i>Done</button></div></div>`);
  document.getElementById("mx").onclick=()=>closeModal(true);
  document.getElementById("mdone3").onclick=()=>closeModal(true);
  const q=document.getElementById("aq");
  q.oninput=e=>{allocState.q=e.target.value;renderAllocAllList();};
  host.querySelectorAll("[data-brand]").forEach(el=>el.onclick=()=>{
    allocState.brand=el.dataset.brand;
    host.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x.dataset.brand===allocState.brand));
    renderAllocAllList();});
  renderAllocAllList();setTimeout(()=>q.focus(),50);
}
function renderAllocAllList(){
  const vis=allocVisible();
  const opts=cur=>[...portfolios.map(p=>({id:p.id,name:p.name+(p.def?" (default)":"")}),),{id:NOPF,name:"\u2014 Not in a portfolio"}]
    .map(o=>`<option value="${o.id}" ${o.id===cur?'selected':''}>${o.name}</option>`).join("");
  const rows=vis.map(({p,i})=>{const ipf=findPf(pfOf(i)),c=colorOf(ipf);
    return `<div class="arow arow-dd" data-rowdd="${i}">
      <div><span class="athumb">${thumb(p.brand)}</span></div>
      <div class="aname"><div class="t">${p.name}</div><div class="s">${p.asin} \u00b7 ${p.brand} \u00b7 ${p.campaigns} campaign${p.campaigns===1?'':'s'}${p.isNew?' \u00b7 <span style="color:#22863d;font-weight:600">new</span>':''}</div></div>
      <div class="statecell"><span class="statepill ${p.active?'act':'pau'}"><i class="ti ti-${p.active?'player-play-filled':'player-pause-filled'}" style="font-size:11px"></i>${p.active?'Active':'Paused'}</span></div>
      <div><select class="pfselect" data-move="${i}" style="border-left:4px solid ${c.dot}">${opts(ipf.id)}</select></div></div>`;}).join("");
  document.getElementById("alist").innerHTML = vis.length
    ? `<div class="alist"><div class="arow arow-dd ahead"><div></div><div>Product</div><div class="statecell">State</div><div>${LABEL_C}</div></div>${rows}</div>`
    : `<div class="alist"><div class="aempty"><i class="ti ti-search-off"></i>No products match \u201c${allocState.q}\u201d${allocState.brand!=="All"?` in ${allocState.brand}`:''}.
        <div style="margin-top:10px"><button class="btn sm" id="clearf">Clear filters</button></div></div></div>`;
  const none=PRODUCTS.filter((p,i)=>pfOf(i)===NOPF).length;
  document.getElementById("acount").textContent=`${vis.length} shown`;
  document.getElementById("afoot").innerHTML=`${PRODUCTS.length} products \u00b7 <b>${portfolios.length}</b> ${LABEL}${portfolios.length===1?'':'s'}${none?` \u00b7 <b style="color:var(--amber-700)">${none}</b> not in a ${LABEL}`:''}`;
  document.querySelectorAll("[data-move]").forEach(sel=>{sel.onchange=e=>{e.stopPropagation();moveOne(+sel.dataset.move,sel.value);};});
  const cf=document.getElementById("clearf");
  if(cf)cf.onclick=()=>{allocState.q="";allocState.brand="All";document.getElementById("aq").value="";
    host.querySelectorAll(".fchip").forEach(x=>x.classList.toggle("on",x.dataset.brand==="All"));renderAllocAllList();};
}

/* --- 3) EDIT (rename + jump to products) --- */
function openEdit(id){
  const pf=findPf(id);modal={type:"edit",id};
  openModal(`<div class="mbox sm">
    <div class="mhead"><span class="hic"><i class="ti ti-pencil"></i></span>
      <div><h3>Edit ${LABEL}</h3><p>Rename it, or change which products it contains.</p></div><button class="x" id="mx">×</button></div>
    <div class="mbody"><div class="fld"><label>${LABEL_C} name</label>
      <input type="text" id="rname" value="${pf.name.replace(/"/g,'&quot;')}" autocomplete="off">
      <div class="errmsg" id="rerr"><i class="ti ti-alert-circle" style="font-size:14px"></i><span id="rerrt"></span></div></div>
      <div style="margin-top:16px"><button class="btn" id="goprod" style="width:100%;justify-content:center">
        <i class="ti ti-package"></i>Manage products (${stats(id).n})</button></div></div>
    <div class="mfoot"><span class="grow"></span><button class="btn" id="mcancel">Cancel</button>
      <button class="btn pf" id="msave"><i class="ti ti-check"></i>Save</button></div></div>`);
  const inp=document.getElementById("rname"),btn=document.getElementById("msave"),
        err=document.getElementById("rerr"),errt=document.getElementById("rerrt");
  const validate=()=>{const v=inp.value.trim();let msg="";
    if(v&&portfolios.some(p=>p.id!==id&&p.name.toLowerCase()===v.toLowerCase()))msg=`A ${LABEL} called “${v}” already exists.`;
    if(msg){err.classList.add("on");errt.textContent=msg;inp.classList.add("err");btn.disabled=true;}
    else{err.classList.remove("on");inp.classList.remove("err");btn.disabled=!v;}};
  inp.oninput=validate;inp.onkeydown=e=>{if(e.key==="Enter"&&!btn.disabled)save();};
  const save=()=>{const old=pf.name;pf.name=inp.value.trim();closeModal(true);if(old!==pf.name)toast(`Renamed to “${pf.name}”.`);};
  document.getElementById("goprod").onclick=()=>{pf.name=inp.value.trim()||pf.name;closeModal(false);openAlloc(id);};
  document.getElementById("mx").onclick=()=>closeModal(false);
  document.getElementById("mcancel").onclick=()=>closeModal(false);
  btn.onclick=save;setTimeout(()=>{inp.focus();inp.select();},50);
}

/* --- 4) DELETE --- */
function openDelete(id){
  const pf=findPf(id),s=stats(id);modal={type:"delete",id};
  openModal(`<div class="mbox sm">
    <div class="mhead"><span class="hic" style="background:#fdeceb;color:var(--red)"><i class="ti ti-trash"></i></span>
      <div><h3>Delete “${pf.name}”?</h3><p>The ${LABEL} is removed. No products or campaigns are deleted.</p></div><button class="x" id="mx">×</button></div>
    <div class="mbody"><div class="warnbox"><i class="ti ti-arrow-back-up"></i><span>
      <b>${s.n} product${s.n===1?'':'s'}</b> will move back to <b>${DEFAULT_NAME}</b> and be budgeted there${s.budget?` (<b>${usd(s.budget)}</b>/wk)`:''}.</span></div></div>
    <div class="mfoot"><span class="grow"></span><button class="btn" id="mcancel">Cancel</button>
      <button class="btn danger" id="mdel"><i class="ti ti-trash"></i>Delete ${LABEL}</button></div></div>`);
  document.getElementById("mx").onclick=()=>closeModal(false);
  document.getElementById("mcancel").onclick=()=>closeModal(false);
  document.getElementById("mdel").onclick=()=>{
    Object.keys(assign).forEach(k=>{if(assign[k]===id)delete assign[k];});
    portfolios=portfolios.filter(p=>p.id!==id);
    if(view.active===id)view.active="default";
    closeModal(true);toast(`“${pf.name}” deleted · ${s.n} product${s.n===1?'':'s'} returned to ${DEFAULT_NAME}.`);};
}

/* ===================== toast + demo ===================== */
let toastT=null;
function toast(msg,undo){
  toastEl.innerHTML=`<i class="ti ti-circle-check ok"></i><span>${msg}</span>${undo?'<button id="undo">Undo</button>':''}`;
  toastEl.classList.add("on");
  const u=document.getElementById("undo");if(u)u.onclick=undoMove;
  clearTimeout(toastT);toastT=setTimeout(hideToast,4200);}
function hideToast(){toastEl.classList.remove("on");}
function renderDemo(){
  demoEl.innerHTML=`<div class="dh"><i class="ti ti-flask"></i>Prototype controls</div>
    <div class="drow"><span class="dsw ${featureOn?'on':''}" id="dfeat"></span><span>${LABEL_C}s ${featureOn?'enabled':'off'} <span style="color:var(--ink-3)">(paid)</span></span></div>
    <div class="drow"><span class="reset" id="dseed"><i class="ti ti-wand" style="font-size:14px"></i>Seed 2 example ${LABEL}s</span></div>
    <div class="drow"><span class="reset" id="dreset"><i class="ti ti-refresh" style="font-size:14px"></i>Reset prototype</span></div>`;
  document.getElementById("dfeat").onclick=()=>{featureOn=!featureOn;if(!featureOn)view={screen:"sp",active:"default",ver:view.ver||"v1"};openMenu=null;render();};
  document.getElementById("dseed").onclick=()=>{
    portfolios=[{id:"default",name:DEFAULT_NAME,def:true,strategies:[newStrat(4,8),newStrat(8,NOWI+3)]},
      {id:"pA",name:"Blackstone · grills",color:PALETTE[0],strategies:[newStrat(6,NOWI+2)]},
      {id:"pB",name:"New launches",color:PALETTE[1],strategies:[]}];
    assign={0:"pA",1:"pA",2:"pA",8:"pB",9:"pB"};
    view={screen:"sp",active:"pA",ver:view.ver||"v1"};openMenu=null;render();toast("Seeded 2 example "+LABEL+"s.");};
  document.getElementById("dreset").onclick=()=>{
    portfolios=[{id:"default",name:DEFAULT_NAME,def:true,strategies:[newStrat(4,8),newStrat(8,NOWI+3)]}];assign={};
    view={screen:"sp",active:"default",ver:view.ver||"v1"};featureOn=true;openMenu=null;lastMove=null;render();toast("Prototype reset.");};
}
/* ===================== timeline interactions ===================== */
function centerCurrentWeek(){
  document.querySelectorAll(".tlscroll").forEach(sc=>{
    const tl=sc.querySelector(".tl");if(!tl)return;
    const colW=(tl.scrollWidth-180)/NW;
    sc.scrollLeft=Math.max(0,180+colW*NOWI-sc.clientWidth/2+colW/2);
    sc.classList.contains("_w")||sc.addEventListener("scroll",()=>tl.classList.toggle("scrolled",sc.scrollLeft>2));
    sc.classList.add("_w");tl.classList.toggle("scrolled",sc.scrollLeft>2);
  });
}
/* whole-column highlight driven from the strategy row / any week cell */
document.addEventListener("mouseover",e=>{
  const tl=e.target.closest(".tl");
  document.querySelectorAll(".ovlay .ov.hot").forEach(x=>x.classList.remove("hot"));
  if(!tl||tl.classList.contains("ro"))return;
  const cellEl=e.target.closest("[data-wk],[data-ovc],.sstrip");
  if(!cellEl)return;
  const ovs=tl.querySelectorAll(".ovlay .ov");
  if(cellEl.classList.contains("sstrip")){
    const seg=stratsOf(activePf()).find(g=>g.id===cellEl.dataset.seg);
    if(seg)for(let i=seg.from;i<Math.min(seg.to,NW);i++)ovs[i]&&ovs[i].classList.add("hot");
  }else{
    const i=+(cellEl.dataset.wk??cellEl.dataset.ovc);
    ovs[i]&&ovs[i].classList.add("hot");
  }
});

/* ===================== strategy side panel (content TBD) ===================== */
const spanel=document.getElementById("spanel");
function openStrategyPanel(mode,wk,segId){
  const pf=activePf(),edit=mode==="edit";
  const seg=edit?stratsOf(pf).find(g=>g.id===segId):null;
  const wkLabel=edit&&seg?`${WEEKS[seg.from]} \u2013 ${WEEKS[Math.min(seg.to,NW)-1]}`:(wk!=null?WEEKS[wk]:"");
  spanel.innerHTML=`<div class="sp-head">
      <div><h3>${edit?"Edit":"Create"} strategy</h3>
        <p>${edit?"Adjust":"Define"} how much \u201c${pf.name}\u201d spends on ads and bidding${wkLabel?` \u00b7 <b>${wkLabel}</b>`:""}.</p></div>
      <button class="x" id="spx">\u00d7</button></div>
    <div class="sp-body"><div class="sp-ph"><i class="ti ti-wave-sine"></i>
      Strategy configuration UI goes here.</div></div>
    <div class="sp-foot"><span class="grow"></span>
      <button class="btn" id="spcancel">Cancel</button>
      <button class="btn green" id="spsave"><i class="ti ti-check"></i>${edit?"Save":"Create"} strategy</button></div>`;
  spanel.classList.add("on");scrim.classList.add("on");
  const close=()=>{spanel.classList.remove("on");scrim.classList.remove("on");};
  document.getElementById("spx").onclick=close;
  document.getElementById("spcancel").onclick=close;
  document.getElementById("spsave").onclick=()=>{
    if(!edit){
      if(!pf.strategies)pf.strategies=[];
      const from=wk!=null?wk:NOWI;
      let to=from+4;                                        /* default 4-week run, clipped to next strategy */
      stratsOf(pf).forEach(g=>{if(g.from>=from&&g.from<to)to=g.from;});
      pf.strategies.push(newStrat(from,Math.min(to,NW)));
    }
    close();render();
    toast(`Strategy ${edit?"updated":"created"} for \u201c${pf.name}\u201d.`);};
}
function deleteStrategySeg(segId){
  const pf=activePf(),seg=stratsOf(pf).find(g=>g.id===segId);
  if(!seg||seg.to<=NOWI)return;                             /* past strategies are records, not editable */
  pf.strategies=stratsOf(pf).filter(g=>g.id!==segId);
  render();toast(`Strategy removed from \u201c${pf.name}\u201d.`);
}


/* ===================== table cell + column hover ===================== */
const PCOLS=15;
function tagCells(){
  document.querySelectorAll(".pgrid").forEach(g=>{
    [...g.children].forEach((c,i)=>{ if(!c.style.gridColumn) c.dataset.col=i%PCOLS; });
  });
  document.querySelectorAll(".wkhead,.satrow,.paRow").forEach(r=>{
    if(r.closest(".nohover"))return;                 /* read-only rows: scroll only, no hover */
    [...r.children].forEach((c,i)=>{ c.dataset.tcol=i; c.classList.add("tlcell"); });
  });
}
function clearHL(){document.querySelectorAll(".cellhl,.colhl").forEach(x=>x.classList.remove("cellhl","colhl"));}
document.addEventListener("mouseover",e=>{
  const cell=e.target.closest(".pgrid > div, .tlcell");
  clearHL(); if(!cell||cell.closest(".nohover"))return;
  cell.classList.add("cellhl");
  const c=cell.dataset.col,t=cell.dataset.tcol;
  if(c!==undefined)document.querySelectorAll('.pgrid > div[data-col="'+c+'"]').forEach(x=>{if(x!==cell)x.classList.add("colhl");});
  if(t!==undefined)document.querySelectorAll('.tlcell[data-tcol="'+t+'"]').forEach(x=>{if(x!==cell)x.classList.add("colhl");});
});

/* ===================== body-level tooltip (escapes scroll/overflow clipping) ===================== */
const ttEl=document.getElementById("tt");let ttTarget=null;
function placeTT(el){const r=el.getBoundingClientRect();ttEl.textContent=el.getAttribute("data-tip")||"";
  ttEl.classList.add("on");const tr=ttEl.getBoundingClientRect();
  let left=r.left+r.width/2-tr.width/2;left=Math.max(8,Math.min(left,window.innerWidth-tr.width-8));
  let top=r.top-tr.height-9;if(top<8)top=r.bottom+9;               // flip below if no room above
  ttEl.style.left=left+"px";ttEl.style.top=top+"px";}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");
  if(el&&el.closest(".nohover"))return;
  if(el&&el!==ttTarget){ttTarget=el;placeTT(el);}});
document.addEventListener("mouseout",e=>{const el=e.target.closest("[data-tip]");
  if(el&&el===ttTarget&&!el.contains(e.relatedTarget)){ttTarget=null;ttEl.classList.remove("on");}});
window.addEventListener("scroll",()=>{if(ttTarget)placeTT(ttTarget);},true);

scrim.onclick=()=>closeModal(modal&&modal.type==="alloc");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modal){const a=modal.type==="alloc";closeModal(a);}else if(openMenu){openMenu=null;render();}}});
render();
</script>
